<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>الـسّـت | welcome in elsit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,700;1,400&family=Tajawal:wght@300;400;500;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            alabaster: '#FDFBF7',
            cream: '#F7F3EC',
            sage: {
              50: '#F2F6F4',
              100: '#E1EBE7',
              500: '#7D938A',
              600: '#5A7369',
              800: '#3D5149',
              900: '#2A3832',
              950: '#1A2420',
            },
            amberAccent: {
              light: '#EAD7C5',
              DEFAULT: '#C88D66',
              dark: '#9E643E',
            }
          },
          fontFamily: {
            sans: ['Tajawal', 'system-ui', 'sans-serif'],
            serif: ['Amiri', 'serif'],
            calligraphy: ['"Aref Ruqaa"', 'Amiri', 'serif'],
            display: ['"Playfair Display"', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #1A2420;
      overflow: hidden;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    @keyframes haloSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .intro-halo-spin {
      animation: haloSpin 12s linear infinite;
    }

    /* Authentic Handkerchief Movement: Cinema-Grade Back & Forth (رايح جاي في الشاشة) + Magic Flash Vanish */
    @keyframes handkerchiefFlyBackAndForth {
      0% {
        opacity: 0;
        transform: translate(280px, 60px) rotate(28deg) scale(0.65);
        filter: drop-shadow(0 10px 20px rgba(200, 141, 102, 0.3));
      }
      12% {
        opacity: 1;
        transform: translate(150px, -20px) rotate(14deg) scale(0.95);
        filter: drop-shadow(0 20px 40px rgba(200, 141, 102, 0.5));
      }
      35% {
        opacity: 1;
        /* Flies smoothly across to the left side */
        transform: translate(-190px, -35px) rotate(-22deg) scale(1.18);
        filter: drop-shadow(-15px 25px 45px rgba(200, 141, 102, 0.6));
      }
      62% {
        opacity: 1;
        /* Swings back across to the right side */
        transform: translate(140px, 20px) rotate(16deg) scale(1.12);
        filter: drop-shadow(15px 25px 45px rgba(200, 141, 102, 0.55));
      }
      80% {
        opacity: 1;
        /* Centers majestically */
        transform: translate(0px, -10px) rotate(-4deg) scale(1.3);
        filter: drop-shadow(0 25px 55px rgba(200, 141, 102, 0.75)) brightness(1.1);
      }
      88% {
        /* "هوب" - Magical golden aura and concentration */
        opacity: 1;
        transform: translate(0px, -10px) rotate(-18deg) scale(1.45);
        filter: drop-shadow(0 0 65px rgba(234, 215, 197, 0.95)) brightness(2.5);
      }
      100% {
        /* "مرة واحدة يختفي بماجيك" - Instant magical spiral vortex flash vanish */
        opacity: 0;
        transform: translate(0px, -60px) rotate(720deg) scale(0);
        filter: blur(30px) brightness(4);
        pointer-events: none;
      }
    }

    /* Natural 3D Silk Ripple & Billow */
    @keyframes handkerchiefSilkFlutter {
      0%, 100% {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
      }
      25% {
        transform: rotateX(22deg) rotateY(16deg) rotateZ(3deg) scale(1.03);
      }
      50% {
        transform: rotateX(-18deg) rotateY(-20deg) rotateZ(-4deg) scale(0.98);
      }
      75% {
        transform: rotateX(15deg) rotateY(-12deg) rotateZ(2deg) scale(1.02);
      }
    }

    .handkerchief-flying-wrapper {
      animation: handkerchiefFlyBackAndForth 2.7s cubic-bezier(0.25, 1, 0.35, 1) forwards;
      perspective: 1200px;
      transform-origin: center center;
      will-change: transform, opacity, filter;
    }

    .handkerchief-cloth-real {
      animation: handkerchiefSilkFlutter 2.7s ease-in-out infinite;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* Phase 2: First Intro Animation Reveal at 2.75s */
    @keyframes firstIntroReveal {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(20px);
        filter: blur(14px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0px);
      }
    }

    .first-intro-container {
      animation: firstIntroReveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) 2.75s forwards;
      opacity: 0; /* starts hidden during handkerchief flight */
      will-change: transform, opacity;
    }
  </style>
</head>
<body class="bg-sage-950 text-alabaster font-sans antialiased min-h-screen flex items-center justify-center relative overflow-hidden select-none">

  <!-- Background Atmospheric Glow Rings & Cosmos -->
  <div class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden">
    <div class="w-[700px] h-[700px] rounded-full bg-amberAccent/15 blur-[140px] animate-pulse"></div>
    <div class="absolute w-[500px] h-[500px] rounded-full bg-sage-600/20 blur-[110px]"></div>
  </div>

  <!-- Skip / Enter Direct Button on Top Left -->
  <a id="skipIntroBtn" href="home.html" class="absolute top-6 left-6 z-30 px-4 py-1.5 rounded-full border border-amberAccent/30 bg-sage-900/80 backdrop-blur-md text-amberAccent-light text-xs font-medium hover:bg-amberAccent hover:text-sage-900 transition-all duration-300">
    تخطي / Skip ✕
  </a>

  <!-- Phase 1: Authentic Umm Kulthum Silk Handkerchief (Flying Back & Forth, without any text underneath) -->
  <div id="introHandkerchiefBox" class="handkerchief-flying-wrapper absolute z-20 flex flex-col items-center justify-center pointer-events-none">
    <div class="handkerchief-cloth-real relative w-72 h-72 sm:w-84 sm:h-84 md:w-96 md:h-96 filter drop-shadow-[0_25px_50px_rgba(200,141,102,0.65)]">
      <img src="assets/omm_handkerchief.png" alt="منديل أم كلثوم الحقيقي" class="w-full h-full object-contain filter contrast-105 brightness-105">
      <!-- Golden Stardust Glow around handkerchief -->
      <div class="absolute -inset-6 rounded-full bg-gradient-to-r from-amberAccent/30 via-white/20 to-amberAccent/40 blur-2xl pointer-events-none -z-10 animate-pulse"></div>
    </div>
  </div>

  <!-- Phase 2: Original First Welcome Intro with Pure Photo of El Sitt on the Left (فقط الست بدون أي زيادات) -->
  <div class="first-intro-container relative z-10 flex flex-col md:flex-row items-center justify-center gap-8 md:gap-14 max-w-4xl mx-auto px-6">
    
    <!-- Left Side: Pure Photo of Umm Kulthum (صورة الست فقط بدون أي زيادات) -->
    <div class="flex-shrink-0 relative">
      <div class="absolute -inset-4 rounded-3xl bg-gradient-to-tr from-amberAccent via-amberAccent-light to-sage-600 opacity-40 blur-xl animate-pulse"></div>
      <div class="relative w-56 h-72 sm:w-64 sm:h-80 md:w-72 md:h-92 rounded-3xl overflow-hidden border-2 border-amberAccent/70 shadow-[0_20px_50px_rgba(200,141,102,0.45)] bg-sage-900 group">
        <img src="assets/omm-kolthoum-pure.png" alt="كوكب الشرق أم كلثوم" class="w-full h-full object-cover object-top transition-transform duration-700 group-hover:scale-105">
        <div class="absolute inset-0 bg-gradient-to-t from-sage-950/80 via-transparent to-transparent flex items-end justify-center pb-3">
          <span class="text-xs font-calligraphy text-amberAccent-light font-bold tracking-wider drop-shadow-md">
            كوكب الشرق • مساحة الـسّـت
          </span>
        </div>
      </div>
    </div>

    <!-- Right Side: The Original First Welcome Animation Elements -->
    <div class="flex flex-col items-center md:items-start text-center md:text-right max-w-md">
      
      <!-- Brand Emblem with Rotating Halo -->
      <div class="relative mb-5 flex items-center justify-center">
        <div class="absolute w-24 h-24 rounded-full border border-dashed border-amberAccent/40 intro-halo-spin"></div>
        <div class="absolute w-28 h-28 rounded-full border border-amberAccent/20 animate-ping" style="animation-duration: 3s;"></div>
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amberAccent via-amberAccent-dark to-sage-800 text-white flex items-center justify-center font-bold text-3xl shadow-2xl shadow-amberAccent/30 border border-amberAccent/50">
          س
        </div>
      </div>

      <!-- Welcome Title: "welcome in elsit" -->
      <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-wide uppercase text-transparent bg-clip-text bg-gradient-to-r from-amberAccent-light via-white to-amberAccent mb-3 drop-shadow-md">
        welcome in elsit
      </h1>

      <!-- Elegant Subtitle & Calligraphy -->
      <p class="text-base sm:text-lg font-calligraphy text-amberAccent-light/90 mb-2">
        مرحباً بكم في واحة الهدوء والإنتاجية
      </p>
      <span class="text-xs tracking-[0.3em] uppercase text-sage-100/60 font-medium mb-6">
        Boutique Workspace • El Sitt
      </span>

      <!-- Smooth Progress Bar -->
      <div class="w-48 sm:w-64 h-1 bg-white/10 rounded-full overflow-hidden relative mb-6">
        <div id="introProgressBar" class="h-full bg-gradient-to-r from-amberAccent to-amberAccent-light rounded-full w-0" style="transition: width 7s linear;"></div>
      </div>

      <!-- Action Button to Enter Site Immediately -->
      <a href="home.html" id="enterSiteBtn" class="px-7 py-3 rounded-2xl bg-gradient-to-r from-amberAccent to-amberAccent-dark hover:from-amberAccent-dark hover:to-amberAccent text-alabaster font-bold text-xs sm:text-sm shadow-xl hover:scale-105 transition-all flex items-center gap-2 group">
        <span>دخول إلى الموقع الآن</span>
        <span class="transform group-hover:-translate-x-1 transition-transform">←</span>
      </a>

    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const progressBar = document.getElementById('introProgressBar');
      if (progressBar) {
        requestAnimationFrame(() => {
          progressBar.style.width = '100%';
        });
      }

      // Automatically transition to the main website after 7 seconds
      const timer = setTimeout(() => {
        window.location.href = 'home.html';
      }, 7000);

      const skipBtn = document.getElementById('skipIntroBtn');
      const enterBtn = document.getElementById('enterSiteBtn');
      if (skipBtn) {
        skipBtn.addEventListener('click', () => clearTimeout(timer));
      }
      if (enterBtn) {
        enterBtn.addEventListener('click', () => clearTimeout(timer));
      }
    });
  </script>
</body>
</html>
